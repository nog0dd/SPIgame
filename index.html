<!DOCTYPE html>
<html>
<head>
    <title>Антикварная лавка</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5ebe0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }
        .game-container {
            background: #e6d5b8;
            border-radius: 50px;
            padding: 30px;
            border: 6px solid #c4a27a;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            max-width: 1800px;
            width: 100%;
        }
        
        /* КНОПКА АДМИНА */
        .admin-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #8b6f50;
            color: white;
            border: none;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            z-index: 2000;
            border: 2px solid #e9b87a;
        }
        
        /* МОДАЛЬНОЕ ОКНО АДМИНА */
        .admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            display: none;
        }
        
        .admin-modal.active {
            display: flex;
        }
        
        .admin-content {
            background: #f5e6d3;
            border-radius: 60px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 6px solid #c4a27a;
        }
        
        .admin-content h2 {
            font-size: 36px;
            color: #4a3729;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .admin-password {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .admin-password input {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border-radius: 40px;
            border: 3px solid #8b6f50;
        }
        
        .admin-password button {
            background: #5fa87f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 18px;
        }
        
        .participants-list {
            background: white;
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .participant-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #e6d5b8;
        }
        
        .close-admin {
            background: #b5926a;
            color: white;
            border: none;
            font-size: 24px;
            padding: 10px 30px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        
        /* ЗАСТАВКИ УРОВНЕЙ */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(230, 213, 184, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            padding: 20px;
        }
        
        .splash-content {
            text-align: center;
            max-width: 800px;
            padding: 50px;
            background: #f5e6d3;
            border-radius: 60px;
            border: 4px solid #a6896b;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }
        
        .splash-content p {
            font-size: 32px;
            color: #4a3729;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        
        .splash-hint {
            font-size: 24px;
            color: #b5926a;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        /* КНОПКА К НАЧАЛУ */
        .restart-btn {
            background: #b5926a;
            color: white;
            border: none;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 80px;
            cursor: pointer;
            border: 4px solid #e9b87a;
            margin: 30px auto 0;
            display: inline-block;
            transition: 0.2s;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
            background: #c4a27a;
        }
        
        /* АНКЕТА */
        .login-screen {
            background: #f5e6d3;
            border-radius: 40px;
            padding: 60px;
            border: 4px solid #a6896b;
            max-width: 700px;
            margin: 50px auto;
            text-align: center;
        }
        
        .login-screen p {
            font-size: 36px;
            font-weight: 900;
            color: #4a3729;
            margin-bottom: 50px;
            line-height: 1.4;
            text-shadow: 2px 2px 0 #e9d4b0;
            letter-spacing: 1px;
        }
        
        .login-input {
            width: 100%;
            padding: 25px;
            font-size: 26px;
            border-radius: 70px;
            border: 4px solid #8b6f50;
            background: white;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .login-btn {
            background: #5fa87f;
            color: white;
            border: none;
            font-size: 36px;
            font-weight: bold;
            padding: 25px 50px;
            border-radius: 80px;
            cursor: pointer;
            border: 4px solid #8fecb0;
            width: 100%;
            transition: 0.2s;
        }
        
        .login-btn:hover {
            transform: scale(1.02);
            background: #6fb98f;
        }
        
        .login-btn:disabled {
            background: #b5926a;
            border-color: #e9b87a;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ПОДСКАЗКА */
        .hint-container {
            text-align: center;
            margin-bottom: 5px;
            padding: 12px 20px;
            background: #d4b595;
            border-radius: 60px;
            border: 3px solid #a6896b;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hint-text {
            font-size: 22px;
            color: #4a3729;
            font-weight: 500;
        }
        
        /* ИГРОВОЙ ЭКРАН */
        .game-screen {
            display: none;
        }
        
        .game-screen.active {
            display: block;
        }
        
        /* КАРТИНКА */
        .image-zone {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: auto;
            aspect-ratio: 1400/900;
            margin: 0 auto 0 auto;
            border-radius: 0;
            overflow: hidden;
            border: 8px solid #b5926a;
            cursor: crosshair;
            background: #f5e6d3;
            touch-action: manipulation;
        }
        
        #gameImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
            pointer-events: auto;
        }
        
        /* ЛУПА */
        .magnifier-container {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            display: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            transform: translate(-50%, -50%);
        }
        
        .magnifier-glass {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid gold;
            box-shadow: 0 0 30px gold, inset 0 0 20px rgba(255,255,255,0.8);
            overflow: hidden;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(1px);
            transform: translate(-100%, -100%);
        }
        
        .magnifier-handle {
            position: absolute;
            width: 180px;
            height: 30px;
            background: linear-gradient(145deg, #b5926a, #6b4f3a);
            border-radius: 30px;
            border: 4px solid #e9b87a;
            transform: rotate(45deg);
            transform-origin: 0 0;
            top: 0;
            left: 0;
            box-shadow: 0 8px 12px rgba(0,0,0,0.3);
        }
        
        .magnifier-handle::after {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: linear-gradient(145deg, #d4b595, #b5926a);
            border-radius: 50%;
            border: 3px solid #e9b87a;
        }
        
        /* ПРЕДМЕТЫ */
        .items-container {
            display: flex;
            overflow-x: auto;
            gap: 30px;
            padding: 20px;
            background: #d4b595;
            border-radius: 60px;
            border: 4px solid #a6896b;
            margin: 0 0 20px 0;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        
        .item-image {
            width: 350px;
            height: 350px;
            flex-shrink: 0;
            object-fit: cover;
            transition: 0.3s;
            filter: brightness(1);
            border-radius: 40px;
            border: 8px solid #e9d4b0;
            background: #f5e6d3;
            padding: 15px;
            transform: scale(1.1);
        }
        
        .item-image.found {
            filter: brightness(0.3) grayscale(1);
            opacity: 0.6;
            border-color: #a6896b;
        }
        
        #message {
            text-align: center;
            font-size: 44px;
            font-weight: bold;
            color: #4a3729;
            margin: 10px 0;
            min-height: 80px;
        }
        
        /* ТЕЛЕФОНЫ */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .game-container {
                padding: 10px;
                border-radius: 30px;
            }
            
            .splash-content {
                padding: 30px;
            }
            
            .splash-content p {
                font-size: 24px;
            }
            
            .login-screen {
                padding: 20px;
            }
            
            .login-screen p {
                font-size: 28px;
                margin-bottom: 30px;
            }
            
            .login-input {
                padding: 15px;
                font-size: 18px;
            }
            
            .login-btn {
                font-size: 24px;
                padding: 15px 30px;
            }
            
            .hint-text {
                font-size: 18px;
            }
            
            .image-zone {
                aspect-ratio: auto;
                height: 70vh;
                max-height: 600px;
                border-width: 4px;
                margin: 0 auto 0 auto;
            }
            
            #gameImage {
                object-fit: cover;
            }
            
            .items-container {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: space-between;
                gap: 4px;
                padding: 0;
                background: transparent;
                border: none;
                margin-top: 0;
                margin-bottom: 0;
                width: 100%;
                overflow-x: visible;
            }
            
            .item-image {
                width: 19%;
                height: auto;
                aspect-ratio: 1/1;
                border-width: 2px;
                padding: 2px;
                margin: 0;
                transform: scale(1.15);
            }
            
            .magnifier-glass {
                width: 140px;
                height: 140px;
            }
            
            .magnifier-handle {
                width: 120px;
                height: 22px;
            }
            
            #message {
                font-size: 24px;
                margin: 5px 0;
            }
            
            .restart-btn {
                font-size: 20px;
                padding: 12px 25px;
            }
        }
        
        @media (max-width: 480px) {
            .image-zone {
                height: 60vh;
                max-height: 500px;
            }
            
            .item-image {
                width: 19%;
                transform: scale(1.1);
            }
            
            .hint-text {
                font-size: 14px;
            }
            
            .magnifier-glass {
                width: 120px;
                height: 120px;
            }
            
            .magnifier-handle {
                width: 100px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- КНОПКА АДМИНА -->
    <button class="admin-btn" id="adminBtn" onclick="openAdminPanel()">Админка</button>
    
    <!-- МОДАЛЬНОЕ ОКНО АДМИНА -->
    <div id="adminModal" class="admin-modal">
        <div class="admin-content">
            <h2>Панель администратора</h2>
            <div class="admin-password">
                <input type="password" id="adminPassword" placeholder="Введите пароль">
                <button onclick="checkAdminPassword()">Войти</button>
            </div>
            <div id="adminParticipants" style="display: none;">
                <h3>Список участников</h3>
                <div class="participants-list" id="participantsList">
                    <!-- Сюда загрузится список -->
                </div>
                <button class="close-admin" onclick="closeAdminPanel()">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <!-- АНКЕТА -->
        <div id="loginScreen" class="login-screen">
            <p>Добро пожаловать в нашу антикварную лавку! Представься, пожалуйста!</p>
            <input type="text" id="loginName" class="login-input" placeholder="Имя Фамилия" oninput="checkLoginForm()">
            <input type="text" id="loginInstitute" class="login-input" placeholder="Институт" oninput="checkLoginForm()">
            <button id="loginBtn" class="login-btn" onclick="startGame()" disabled>ВОЙТИ</button>
        </div>
        
        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="gameScreen" class="game-screen">
            <!-- ПОДСКАЗКА -->
            <div class="hint-container">
                <span class="hint-text">🔍 нажми на картинку для лупы (ПК) / задержи палец (телефон)</span>
            </div>
            
            <!-- КАРТИНКА -->
            <div class="image-zone" id="imageZone">
                <img src="игра1/игра.jpg" id="gameImage" alt="Антикварная лавка">
                <!-- ЛУПА -->
                <div class="magnifier-container" id="magnifierContainer">
                    <div class="magnifier-glass" id="magnifierGlass"></div>
                    <div class="magnifier-handle"></div>
                </div>
            </div>
            
            <div id="message"></div>
            
            <!-- ПРЕДМЕТЫ -->
            <div class="items-container" id="itemsContainer"></div>
        </div>
    </div>

    <script>
        // ============================================
        // ДАННЫЕ ИГРОКОВ
        // ============================================
        let participants = JSON.parse(localStorage.getItem('participants')) || [];
        
        // ============================================
        // АДМИН-ПАНЕЛЬ
        // ============================================
        const ADMIN_PASSWORD = "admin123";
        
        function openAdminPanel() {
            document.getElementById('adminModal').classList.add('active');
            loadParticipantsList();
        }
        
        function closeAdminPanel() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminParticipants').style.display = 'none';
        }
        
        function checkAdminPassword() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('adminParticipants').style.display = 'block';
                loadParticipantsList();
            } else {
                alert('Неверный пароль!');
            }
        }
        
        function loadParticipantsList() {
            const list = document.getElementById('participantsList');
            if (participants.length === 0) {
                list.innerHTML = '<p>Пока нет участников</p>';
                return;
            }
            
            let html = '';
            participants.forEach((p, index) => {
                html += `
                    <div class="participant-item">
                        <span>${index + 1}. ${p.name}</span>
                        <span>${p.institute}</span>
                        <span>${p.date}</span>
                    </div>
                `;
            });
            list.innerHTML = html;
        }
        
        // ============================================
        // ЛУПА И ИГРА
        // ============================================
        const imageZone = document.getElementById('imageZone');
        const magnifierContainer = document.getElementById('magnifierContainer');
        const magnifierGlass = document.getElementById('magnifierGlass');
        const gameImage = document.getElementById('gameImage');
        const adminBtn = document.getElementById('adminBtn');
        
        let currentLevel = 1;
        let longPressTimer = null;
        let isLongPress = false;
        let startX, startY;
        let isMouseDown = false;
        
        // ПРЕДМЕТЫ - ТВОИ НОВЫЕ КООРДИНАТЫ
        const level1Items = [
            { name: "СУНДУК", file: "игра1/сундук.png", x: 385, y: 742, radius: 45, found: false },
            { name: "ЗОНТ", file: "игра1/зонт.png", x: 381, y: 239, radius: 45, found: false },
            { name: "ЗЕРКАЛО2", file: "игра1/зеркало2.png", x: 246, y: 565, radius: 45, found: false },
            { name: "ЗЕРКАЛО", file: "игра1/зеркало.png", x: 297, y: 397, radius: 25, found: false },
            { name: "ВАЗА", file: "игра1/ваза.png", x: 326, y: 413, radius: 25, found: false }
        ];
        
        const level2Items = [
            { name: "КАРТИНА", file: "игра2/картина.png", x: 241, y: 275, radius: 45, found: false },
            { name: "ЧАСИКИ", file: "игра2/часики.png", x: 338, y: 247, radius: 45, found: false },
            { name: "САМОВАР", file: "игра2/самовар.png", x: 328, y: 712, radius: 45, found: false },
            { name: "ЧУЧЕЛО", file: "игра2/чучело.png", x: 247, y: 874, radius: 45, found: false },
            { name: "ЗАМОК", file: "игра2/замок.png", x: 234, y: 653, radius: 45, found: false }
        ];
        
        const level3Items = [
            { name: "РУСАЛКА", file: "игра3/русалка.png", x: 291, y: 101, radius: 45, found: false },
            { name: "ТАРЕЛКА", file: "игра3/тарелка.png", x: 460, y: 543, radius: 45, found: false },
            { name: "ЛАМПА", file: "игра3/лампа.png", x: 381, y: 319, radius: 45, found: false },
            { name: "ШКАТУЛКА", file: "игра3/шкатулка.png", x: 550, y: 764, radius: 45, found: false },
            { name: "УРНА", file: "игра3/урна.png", x: 421, y: 685, radius: 45, found: false }
        ];

        let items = level1Items;

        function updateMagnifier(clientX, clientY) {
            const rect = imageZone.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            if (x < 0 || x > rect.width || y < 0 || y > rect.height) {
                magnifierContainer.style.display = 'none';
                return false;
            }
            
            if (x < 10 || x > rect.width - 10 || y < 10 || y > rect.height - 10) {
                magnifierContainer.style.display = 'none';
                return false;
            }
            
            magnifierContainer.style.display = 'block';
            magnifierContainer.style.left = clientX + 'px';
            magnifierContainer.style.top = clientY + 'px';
            
            const zoomLevel = 1.2;
            const imgCenterX = (x / rect.width) * gameImage.naturalWidth;
            const imgCenterY = (y / rect.height) * gameImage.naturalHeight;
            const lensSize = 150;
            
            const bgX = imgCenterX - lensSize / 2;
            const bgY = imgCenterY - lensSize / 2;
            
            magnifierGlass.style.backgroundImage = `url('${gameImage.src}')`;
            magnifierGlass.style.backgroundSize = `${gameImage.naturalWidth}px ${gameImage.naturalHeight}px`;
            magnifierGlass.style.backgroundPosition = `-${bgX}px -${bgY}px`;
            
            return true;
        }
        
        // ТЕЛЕФОН
        imageZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                updateMagnifier(startX, startY);
            }, 300);
        });
        
        imageZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            
            if (isLongPress) {
                updateMagnifier(touch.clientX, touch.clientY);
            } else {
                const dx = Math.abs(touch.clientX - startX);
                const dy = Math.abs(touch.clientY - startY);
                if (dx > 15 || dy > 15) {
                    clearTimeout(longPressTimer);
                }
            }
        });
        
        imageZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            
            if (!isLongPress) {
                const touch = e.changedTouches[0];
                if (touch) {
                    handleClick(touch.clientX, touch.clientY);
                }
            }
            
            clearTimeout(longPressTimer);
            isLongPress = false;
            magnifierContainer.style.display = 'none';
        });
        
        // МЫШЬ
        imageZone.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isMouseDown = true;
            updateMagnifier(e.clientX, e.clientY);
        });
        
        imageZone.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                updateMagnifier(e.clientX, e.clientY);
            }
        });
        
        imageZone.addEventListener('mouseup', () => {
            isMouseDown = false;
            magnifierContainer.style.display = 'none';
        });
        
        imageZone.addEventListener('mouseleave', () => {
            isMouseDown = false;
            magnifierContainer.style.display = 'none';
        });
        
        imageZone.addEventListener('click', (e) => {
            if (!isLongPress) {
                handleClick(e.clientX, e.clientY);
            }
        });
        
        // ОБРАБОТЧИК КЛИКА (С АВТОПОДСТРОЙКОЙ ПОД ТЕЛЕФОН)
        function handleClick(clientX, clientY) {
            const rect = imageZone.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;
            
            if (clickX < 0 || clickX > rect.width || clickY < 0 || clickY > rect.height) {
                return;
            }
            
            const scaleX = gameImage.naturalWidth / rect.width;
            const scaleY = gameImage.naturalHeight / rect.height;
            const imgX = Math.round(clickX * scaleX);
            const imgY = Math.round(clickY * scaleY);

            // Определяем устройство
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            items.forEach(item => {
                if (!item.found) {
                    const dx = imgX - item.x;
                    const dy = imgY - item.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    // Для телефона радиус зависит от ширины картинки (12% от ширины)
                    // Для ПК используем фиксированный радиус
                    const activeRadius = isTouch ? (rect.width * 0.12) : item.radius;
                    
                    if (distance < activeRadius) {
                        item.found = true;
                        console.log(`Найден: ${item.name} (${isTouch ? 'телефон' : 'ПК'})`);
                    }
                }
            });

            updateItemsList();
        }
        
        // АНКЕТА
        let currentPlayer = {
            name: '',
            institute: ''
        };
        
        function checkLoginForm() {
            const name = document.getElementById('loginName').value.trim();
            const institute = document.getElementById('loginInstitute').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = !(name && institute);
        }
        
        function startGame() {
            currentPlayer.name = document.getElementById('loginName').value.trim();
            currentPlayer.institute = document.getElementById('loginInstitute').value.trim();
            
            // Сохраняем участника
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU');
            participants.push({
                name: currentPlayer.name,
                institute: currentPlayer.institute,
                date: dateStr
            });
            localStorage.setItem('participants', JSON.stringify(participants));
            
            // Прячем кнопку админки и анкету
            adminBtn.style.display = 'none';
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            
            showLevelSplash('Слушай, у нас здесь затерялось парочку диковин, не поможешь найти?');
        }
        
        // ЗАСТАВКИ
        function showLevelSplash(text) {
            const splash = document.createElement('div');
            splash.className = 'splash-screen';
            splash.innerHTML = `
                <div class="splash-content">
                    <p>${text}</p>
                    <div class="splash-hint">👇 Нажми в любое место 👇</div>
                </div>
            `;
            
            document.body.appendChild(splash);
            
            splash.addEventListener('click', function() {
                this.remove();
            });
        }
        
        function showFinalSplash() {
            const splash = document.createElement('div');
            splash.className = 'splash-screen';
            splash.innerHTML = `
                <div class="splash-content">
                    <p>Ну ты настоящий сыщик! Очень помог нам. В долгу не останемся!</p>
                    <button class="restart-btn" onclick="restartToLogin()">К НАЧАЛУ</button>
                </div>
            `;
            
            document.body.appendChild(splash);
        }
        
        function restartToLogin() {
            document.querySelectorAll('.splash-screen').forEach(el => el.remove());
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('loginName').value = '';
            document.getElementById('loginInstitute').value = '';
            document.getElementById('loginBtn').disabled = true;
            adminBtn.style.display = 'block'; // Показываем кнопку админки обратно
        }
        
        // ОБНОВЛЕНИЕ СПИСКА ПРЕДМЕТОВ
        const itemsContainer = document.getElementById('itemsContainer');
        const messageDiv = document.getElementById('message');

        function updateItemsList() {
            let html = '';
            items.forEach(item => {
                const foundClass = item.found ? 'found' : '';
                html += `<img src="${item.file}" class="item-image ${foundClass}" alt="${item.name}">`;
            });
            itemsContainer.innerHTML = html;

            if (items.every(item => item.found)) {
                if (currentLevel === 1) {
                    messageDiv.innerHTML = '';
                    showLevelSplash('Ох! Спасибо! Выручил! Сможешь найти ещё несколько предметов?');
                    switchToLevel(2);
                } else if (currentLevel === 2) {
                    messageDiv.innerHTML = '';
                    showLevelSplash('У тебя отлично получается! Как на счёт того, чтобы в последний раз выручить нас? Постарайся найти эти предметы');
                    switchToLevel(3);
                } else if (currentLevel === 3) {
                    messageDiv.innerHTML = '';
                    showFinalSplash();
                }
            } else {
                messageDiv.innerHTML = '';
            }
        }

        function switchToLevel(level) {
            currentLevel = level;
            
            const levelMap = {
                1: { src: 'игра1/игра.jpg', items: level1Items },
                2: { src: 'игра2/игра2.jpg', items: level2Items },
                3: { src: 'игра3/игра3.jpg', items: level3Items }
            };
            
            document.getElementById('gameImage').src = levelMap[level].src;
            items = levelMap[level].items;
            
            items.forEach(item => item.found = false);
            updateItemsList();
            messageDiv.innerHTML = '';
        }

        // Инициализация
        gameImage.onload = () => {
            updateItemsList();
        };
        
        if (gameImage.complete) {
            updateItemsList();
        }
        
        updateItemsList();
    </script>
</body>
</html>
